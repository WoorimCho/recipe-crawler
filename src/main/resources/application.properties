spring.application.name=recipe-crawler
server.port=8086

# --- Downstream catalogue services -----------------------------------------
recipe-catalogue.url=${RECIPE_CATALOGUE_URL:http://localhost:8083}
ingredient-catalogue.url=${INGREDIENT_CATALOGUE_URL:http://localhost:8082}

# Fail fast on a slow source page or a dead catalogue instead of hanging a
# request thread. spring.http.clients.* (plural) is the Boot 4.1 key that feeds
# the shared HttpClientSettings -> the auto-configured RestClient.Builder.
spring.http.clients.connect-timeout=${DOWNSTREAM_CONNECT_TIMEOUT:3s}
spring.http.clients.read-timeout=${DOWNSTREAM_READ_TIMEOUT:10s}

# Cap on the source page we'll download (bytes).
crawler.max-page-bytes=${CRAWLER_MAX_PAGE_BYTES:3000000}
# Creator stamped on imported recipes (the source host is appended).
crawler.creator-prefix=${CRAWLER_CREATOR_PREFIX:import}
# Sent as User-Agent; the "RecipeCrawler" token is matched against robots.txt
# groups. The Mozilla/5.0 (compatible; …) form is the well-behaved-bot convention
# (Googlebot / bingbot style) — still honest about what it is, but plain
# "recipe-crawler/…" trips naive filters that block anything without a browser token.
crawler.user-agent=${CRAWLER_USER_AGENT:Mozilla/5.0 (compatible; RecipeCrawler/0.1; +https://github.com/WoorimCho/recipe-crawler)}

# --- Crawl (POST /api/crawl) --------------------------------------------------
# Politeness: min gap between requests to the SAME host.
crawler.politeness-delay=${CRAWLER_POLITENESS_DELAY:1500ms}
# Defaults when the request omits them (both are clamped: pages 1..200, depth 0..5).
crawler.max-pages=${CRAWLER_MAX_PAGES:25}
crawler.max-depth=${CRAWLER_MAX_DEPTH:2}

# --- Free-text fallback (LLM) — import path only ----------------------------
# When a single-URL import (POST /api/import/preview | /commit) hits a page with
# no schema.org JSON-LD / microdata Recipe, POST its visible text to an
# OpenAI-compatible /chat/completions endpoint and ask for the recipe as JSON.
# OFF unless base-url + model + api-key are ALL set. Provider-neutral: OpenAI,
# Anthropic (https://api.anthropic.com/v1), Gemini's OpenAI endpoint, Groq,
# OpenRouter, a local Ollama (http://localhost:11434/v1 — set api-key to any
# non-blank string, it's ignored), etc. The crawler (POST /api/crawl) never
# calls it, so a walk can't fan out into one LLM call per page.
llm.base-url=${LLM_BASE_URL:}
llm.model=${LLM_MODEL:}
llm.api-key=${LLM_API_KEY:}
llm.json-mode=${LLM_JSON_MODE:true}
llm.temperature=${LLM_TEMPERATURE:0}
llm.max-input-chars=${LLM_MAX_INPUT_CHARS:12000}
llm.max-output-tokens=${LLM_MAX_OUTPUT_TOKENS:2048}
llm.read-timeout-seconds=${LLM_READ_TIMEOUT_SECONDS:45}

# --- Operations & tracing -------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# --- Inter-service auth (SECURITY.md C2) -------------------------------------
# Sign catalogue writes with an HMAC X-Internal-Auth header.
internal-auth.enabled=${INTERNAL_AUTH_ENABLED:true}
# No default (SECURITY.md N1): startup fails unless INTERNAL_AUTH_SECRET is at
# least 32 random characters - from the environment in containers, locally from
# the git-ignored .env in the project directory.
internal-auth.secret=${INTERNAL_AUTH_SECRET:}
spring.config.import=optional:file:.env[.properties]
