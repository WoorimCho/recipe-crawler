spring.application.name=recipe-crawler
server.port=8086

# --- Downstream catalogue services -----------------------------------------
recipe-catalogue.url=${RECIPE_CATALOGUE_URL:http://localhost:8083}
ingredient-catalogue.url=${INGREDIENT_CATALOGUE_URL:http://localhost:8082}

# Fail fast on a slow source page or a dead catalogue instead of hanging a
# request thread. spring.http.clients.* (plural) is the Boot 4.1 key that feeds
# the shared HttpClientSettings -> the auto-configured RestClient.Builder.
spring.http.clients.connect-timeout=${DOWNSTREAM_CONNECT_TIMEOUT:3s}
spring.http.clients.read-timeout=${DOWNSTREAM_READ_TIMEOUT:10s}

# Cap on the source page we'll download (bytes).
crawler.max-page-bytes=${CRAWLER_MAX_PAGE_BYTES:3000000}
# Creator stamped on imported recipes (the source host is appended).
crawler.creator-prefix=${CRAWLER_CREATOR_PREFIX:import}

# --- Operations & tracing -------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
